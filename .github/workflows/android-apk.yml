name: Compilar GPS Brasil APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Aviso sobre chave do Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::MAPS_API_KEY não configurada: o APK pode ser gerado, mas o Google Maps não exibirá os mapas."
            echo "Configure o segredo MAPS_API_KEY em Settings > Secrets and variables > Actions."
          fi
      - name: Compilar APK de teste
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Brasil-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
